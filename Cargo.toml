[package]
name = "file_dialog"
version = "0.0.3"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[dependencies]
duckdb-neo = { version = "~0.20000.1", features = ["build-extension"] }
duckdb-loadable-macros = { version = "~1.20000.1", features = ["neo"] }
# rfd 0.16 gated its Wayland support behind a `wayland` feature that is enabled
# by default. That feature pulls in wayland-sys, whose build script requires the
# `wayland-client` system library via pkg-config, which isn't present in DuckDB's
# Linux build containers. The feature is only used to resolve a parent window for
# `set_parent()`, which this extension never calls, so we opt out of it and keep
# just the XDG Desktop Portal backend.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
